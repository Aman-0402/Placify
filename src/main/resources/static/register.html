<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07101f">
    <title>Placify | Create Account</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-body">

<header class="auth-topbar">
    <a class="auth-topbar-brand" href="/">
        <img src="/images/Logo.png" alt="Placify">
        <span>Placify</span>
    </a>
    <a class="auth-topbar-link" href="/login.html">Sign in</a>
</header>

<div class="auth-wrap auth-wrap--wide">
    <div class="auth-card">
        <div class="auth-card-header">
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Free for students, forever</p>
        </div>

        <div class="alert hidden" id="pageMessage" role="status" aria-live="polite"></div>

        <form class="form-stack" id="registerForm" novalidate>
            <div class="auth-role-tabs" id="roleTabs">
                <button class="auth-role-tab active" type="button" data-role="STUDENT">Student</button>
                <button class="auth-role-tab" type="button" data-role="RECRUITER">Recruiter</button>
            </div>
            <input type="hidden" id="registerRole" value="STUDENT">

            <label class="field">
                <span>Full name</span>
                <input id="registerName" type="text" placeholder="Your full name" autocomplete="name" required>
            </label>
            <label class="field">
                <span>Email address</span>
                <input id="registerEmail" type="email" placeholder="you@college.edu" autocomplete="email" required>
            </label>
            <label class="field">
                <span>Password</span>
                <input id="registerPassword" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" required minlength="8">
            </label>

            <div id="studentFields">
                <div class="form-stack">
                    <label class="field">
                        <span>Branch / Department</span>
                        <input id="registerBranch" type="text" placeholder="e.g. Computer Science" required>
                    </label>
                    <label class="field">
                        <span>Resume link</span>
                        <input id="registerResume" type="url" placeholder="https://drive.google.com/..." required>
                    </label>
                    <div class="field">
                        <span>Skills</span>
                        <div class="skills-box" id="skillsBox">
                            <input class="skills-type-input" id="skillsTypeInput" type="text" placeholder="Type a skill and press Enter or comma…" autocomplete="off">
                            <div class="skills-dropdown hidden" id="skillsDropdown"></div>
                        </div>
                        <input type="hidden" id="registerSkills" required>
                    </div>
                </div>
            </div>

            <button class="button primary button--full" id="registerButton" type="submit">Create Account</button>
        </form>

        <p class="auth-alt-link">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
</div>

<script type="module" src="/js/register-page.js"></script>
</body>
</html>
