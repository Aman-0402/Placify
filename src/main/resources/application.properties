spring.application.name=careerlink

server.port=${CAREERLINK_SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/careerlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${CAREERLINK_DB_USERNAME:root}
spring.datasource.password=${CAREERLINK_DB_PASSWORD:K04}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${CAREERLINK_JWT_SECRET:CareerLinkJwtSecretKeyForCampusPlacementManagementSystem2026Secure}
app.jwt.expiration-ms=${CAREERLINK_JWT_EXPIRATION_MS:86400000}
app.seed.enabled=${CAREERLINK_SEED_ENABLED:false}

logging.level.org.springframework.web.servlet.handler.HandlerMappingIntrospector=ERROR
